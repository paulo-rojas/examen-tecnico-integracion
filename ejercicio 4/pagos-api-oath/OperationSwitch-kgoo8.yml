kind: OperationSwitch
apiVersion: api.ibm.com/v1
metadata:
  name: OperationSwitch-kgoo8
  namespace: pagos-api-oauth
  version: '1.0'
  tags: []
  labels:
    gatewayTypes:
      - nano
spec:
  cases:
    - conditions:
        - verbPath:
            path: /initiate
            verb: POST
      execute:
        - $ref: pagos-api-oauth:ValidateAPISpecification-FAs6H:1.0
        - $ref: pagos-api-oauth:Invoke-cFg2w:1.0
    - conditions:
        - verbPath:
            path: /status/{paymentId}
            verb: GET
      execute:
        - $ref: pagos-api-oauth:Invoke-nweTc:1.0
        - $ref: pagos-api-oauth:Parse-91e0y:1.0
        - $ref: pagos-api-oauth:Transform-9vuaq:1.0
    - conditions:
        - verbPath:
            path: /cancel/{paymentId}
            verb: DELETE
      execute:
        - $ref: pagos-api-oauth:Set-4VwcP:1.0
