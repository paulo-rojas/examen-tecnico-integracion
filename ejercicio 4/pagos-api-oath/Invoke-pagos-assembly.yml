kind: Invoke
apiVersion: api.ibm.com/v1
metadata:
  name: invoke-pagos-assembly
  namespace: pagos-api-oauth
  version: '1.0'
  tags: []
  labels:
    gatewayTypes:
      - nano
spec:
  endpoint:
    http:
      target:
        persistentConnections: false
        timeout: 30
        url: /pagos/v1
        decompressResponse: false
        followRedirects: false
        chunkedUpload: false
